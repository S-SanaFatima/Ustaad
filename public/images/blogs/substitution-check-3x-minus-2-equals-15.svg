<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" style="background:#f8fafc; border-radius:18px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="sub-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a1f3d" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="400" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="230" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="12" y="17" font-size="11.5" font-weight="800" fill="#1e40af" letter-spacing="0.5">
      INDEPENDENT VERIFICATION ROUTE
    </text>

    <text x="0" y="52" font-size="22" font-weight="800" fill="#0a1f3d">
      Testing by Substitution: Original Equation <tspan fill="#0f4a9b" font-family="'Times New Roman', serif" font-style="italic">3(x − 2) = 15</tspan>
    </text>
    <text x="0" y="74" font-size="13.5" font-weight="500" fill="#64748b">
      Checking without repeating the same steps that made the original error.
    </text>
  </g>

  <!-- Left Panel: Incorrect Answer (x = 3) -->
  <g transform="translate(36, 125)" filter="url(#sub-shadow)">
    <rect width="424" height="240" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="2" />
    
    <!-- Red Top Badge -->
    <rect x="0" y="0" width="424" height="42" rx="14" fill="#fef2f2" />
    <line x1="0" y1="42" x2="424" y2="42" stroke="#fee2e2" stroke-width="1" />
    
    <circle cx="28" cy="21" r="10" fill="#ef4444" />
    <path d="M 23 16 L 33 26 M 33 16 L 23 26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    
    <text x="46" y="26" font-size="14" font-weight="800" fill="#991b1b">
      PROPOSED CANDIDATE: x = 3
    </text>

    <!-- Substitution Steps -->
    <g transform="translate(24, 76)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#64748b">Substitute into Left Hand Side (LHS):</text>
      
      <g transform="translate(0, 32)">
        <rect x="0" y="-22" width="376" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="6" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#0f172a">
          LHS = 3(<tspan fill="#ef4444" font-weight="800">3</tspan> − 2) = 3 × 1 = <tspan fill="#ef4444">3</tspan>
        </text>
      </g>

      <g transform="translate(0, 88)">
        <text x="0" y="0" font-size="13" font-weight="700" fill="#64748b">Compare to Right Hand Side (RHS):</text>
        <rect x="0" y="8" width="376" height="38" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
        <text x="14" y="32" font-size="14" font-weight="800" fill="#b91c1c">
          3 ≠ 15  ✗  (LHS ≠ RHS — Answer is WRONG)
        </text>
      </g>
    </g>
  </g>

  <!-- Right Panel: Correct Answer (x = 7) -->
  <g transform="translate(500, 125)" filter="url(#sub-shadow)">
    <rect width="424" height="240" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" />
    
    <!-- Green Top Badge -->
    <rect x="0" y="0" width="424" height="42" rx="14" fill="#ecfdf5" />
    <line x1="0" y1="42" x2="424" y2="42" stroke="#d1fae5" stroke-width="1" />
    
    <circle cx="28" cy="21" r="10" fill="#10b981" />
    <path d="M 23 21 L 27 25 L 34 17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <text x="46" y="26" font-size="14" font-weight="800" fill="#065f46">
      CORRECTED VALUE: x = 7
    </text>

    <!-- Substitution Steps -->
    <g transform="translate(24, 76)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#64748b">Substitute into Left Hand Side (LHS):</text>
      
      <g transform="translate(0, 32)">
        <rect x="0" y="-22" width="376" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="6" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#0f172a">
          LHS = 3(<tspan fill="#10b981" font-weight="800">7</tspan> − 2) = 3 × 5 = <tspan fill="#10b981">15</tspan>
        </text>
      </g>

      <g transform="translate(0, 88)">
        <text x="0" y="0" font-size="13" font-weight="700" fill="#64748b">Compare to Right Hand Side (RHS):</text>
        <rect x="0" y="8" width="376" height="38" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1" />
        <text x="14" y="32" font-size="14" font-weight="800" fill="#047857">
          15 = 15  ✓  (Both sides equal — VERIFIED)
        </text>
      </g>
    </g>
  </g>
</svg>
