<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#f1f5f9; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Comic Sans MS', cursive, sans-serif;">
  <defs>
    <!-- Desk Wood Texture Gradient -->
    <linearGradient id="desk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8ecf2" />
      <stop offset="50%" stop-color="#dfe5ed" />
      <stop offset="100%" stop-color="#d4dce6" />
    </linearGradient>

    <!-- Notebook Paper Drop Shadow -->
    <filter id="paper-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0a1f3d" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0a1f3d" flood-opacity="0.08" />
    </filter>

    <!-- Pen Shadow -->
    <filter id="pen-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="8" flood-color="#0a1f3d" flood-opacity="0.18" />
    </filter>

    <!-- Lined Paper Pattern -->
    <pattern id="ruled-lines" width="100" height="42" patternUnits="userSpaceOnUse">
      <line x1="0" y1="41" x2="100" y2="41" stroke="#cbd5e1" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Desk Background -->
  <rect width="1200" height="675" fill="url(#desk)" />

  <!-- Background decorative academic subtle elements -->
  <g opacity="0.4" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" fill="none">
    <circle cx="150" cy="120" r="80" />
    <path d="M 1100 80 L 1150 180 L 1050 180 Z" />
    <text x="100" y="580" font-family="monospace" font-size="14" fill="#64748b" font-weight="600">IGCSE / GCSE MATHS · WORKING DIAGNOSTIC</text>
  </g>

  <!-- Open Notebook Page Container -->
  <g transform="translate(180, 55)" filter="url(#paper-shadow)">
    <!-- Paper Sheet (Clean Ivory / White) -->
    <rect width="840" height="565" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Lined Ruled Paper Layer -->
    <rect x="0" y="50" width="840" height="515" fill="url(#ruled-lines)" rx="0" />

    <!-- Red Margin Line -->
    <line x1="130" y1="0" x2="130" y2="565" stroke="#fca5a5" stroke-width="2" />

    <!-- Spiral / Left Binding Perforations -->
    <g fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1">
      <circle cx="28" cy="40" r="7" />
      <circle cx="28" cy="90" r="7" />
      <circle cx="28" cy="140" r="7" />
      <circle cx="28" cy="190" r="7" />
      <circle cx="28" cy="240" r="7" />
      <circle cx="28" cy="290" r="7" />
      <circle cx="28" cy="340" r="7" />
      <circle cx="28" cy="390" r="7" />
      <circle cx="28" cy="440" r="7" />
      <circle cx="28" cy="490" r="7" />
      <circle cx="28" cy="540" r="7" />
    </g>

    <!-- Header Date & Question Banner -->
    <rect x="145" y="16" width="670" height="28" rx="6" fill="#f8fafc" />
    <text x="160" y="35" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f4a9b" letter-spacing="0.5">
      USTAAD UAE · MATHS DIAGNOSTIC: FINDING THE FIRST INCORRECT STEP
    </text>
    <text x="795" y="35" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">
      OCTOBER 2026
    </text>

    <!-- Question Prompt -->
    <g transform="translate(160, 95)">
      <rect x="-8" y="-22" width="230" height="30" rx="6" fill="#0f4a9b" />
      <text x="6" y="-2" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff">
        QUESTION 1 [3 MARKS]
      </text>

      <text x="0" y="32" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#0a1f3d">
        Solve the linear equation:
      </text>
      
      <text x="310" y="33" font-family="'Times New Roman', Times, serif" font-size="28" font-style="italic" font-weight="700" fill="#0f4a9b">
        3(x − 2) = 15
      </text>
    </g>

    <!-- Student Handwritten Solution Section -->
    <g transform="translate(160, 205)">
      <text x="0" y="-12" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-transform="uppercase" letter-spacing="1">
        Student's Handwritten Working:
      </text>

      <!-- Line 1: Original Equation -->
      <g transform="translate(40, 36)">
        <text x="0" y="0" font-family="'Comic Sans MS', 'Chalkboard SE', 'Caveat', cursive, sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">
          3(x − 2) = 15
        </text>
        <rect x="250" y="-24" width="76" height="24" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2" />
        <text x="288" y="-8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">✓ Given</text>
      </g>

      <!-- Line 2: Dividing by 3 -->
      <g transform="translate(40, 98)">
        <text x="0" y="0" font-family="'Comic Sans MS', 'Chalkboard SE', 'Caveat', cursive, sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">
          x − 2 = 5
        </text>
        <!-- Operation Note -->
        <text x="180" y="-2" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748b">
          (÷ 3 both sides)
        </text>
        <rect x="320" y="-24" width="84" height="24" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2" />
        <text x="362" y="-8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">✓ Correct</text>
      </g>

      <!-- Line 3: The Common Silly Mistake -->
      <g transform="translate(40, 160)">
        <!-- Circled in Red -->
        <ellipse cx="65" cy="-8" rx="85" ry="34" fill="#fee2e2" fill-opacity="0.35" stroke="#dc2626" stroke-width="3" stroke-dasharray="300" stroke-dashoffset="0" transform="rotate(-3, 65, -8)" />
        
        <text x="0" y="0" font-family="'Comic Sans MS', 'Chalkboard SE', 'Caveat', cursive, sans-serif" font-size="36" font-weight="700" fill="#dc2626">
          x = 3
        </text>

        <!-- Red Cross -->
        <circle cx="160" cy="-8" r="14" fill="#dc2626" />
        <path d="M 153 -15 L 167 -1 M 167 -15 L 153 -1" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

        <!-- Tutor's Annotation -->
        <g transform="translate(195, -28)">
          <path d="M -12 18 C 5 24 25 15 35 -2" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow)" />
          <rect x="38" y="-18" width="370" height="52" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" />
          <text x="50" y="3" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#991b1b">
            FIRST INCORRECT STEP: SUBTRACTION SLIP!
          </text>
          <text x="50" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c">
            Needed to ADD 2 to both sides: x = 5 + 2 = 7 (not 5 − 2)
          </text>
        </g>
      </g>

      <!-- Independent Check Callout Box -->
      <g transform="translate(40, 235)">
        <rect x="0" y="0" width="580" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
        <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e40af">
          Independent Check: 3(3 − 2) = 3 × 1 = 3 ≠ 15 ✗  |  Correct: 3(7 − 2) = 3 × 5 = 15 ✓
        </text>
      </g>
    </g>
  </g>

  <!-- Wooden Pencil Prop on Desk -->
  <g transform="translate(1040, 180) rotate(16)" filter="url(#pen-shadow)">
    <!-- Pencil Body (Yellow Gold Hexagonal) -->
    <rect x="0" y="0" width="18" height="320" rx="3" fill="#eab308" stroke="#ca8a04" stroke-width="1" />
    <rect x="4" y="0" width="10" height="320" fill="#facc15" />
    
    <!-- Metal Ferrule -->
    <rect x="0" y="320" width="18" height="24" fill="#94a3b8" stroke="#64748b" stroke-width="0.8" />
    <line x1="0" y1="326" x2="18" y2="326" stroke="#475569" stroke-width="1" />
    <line x1="0" y1="334" x2="18" y2="334" stroke="#475569" stroke-width="1" />
    
    <!-- Pink Eraser -->
    <path d="M 0 344 L 18 344 C 18 354 14 360 9 360 C 4 360 0 354 0 344 Z" fill="#f472b6" stroke="#db2777" stroke-width="0.8" />

    <!-- Sharpened Wood Tip -->
    <polygon points="0,0 18,0 9,-36" fill="#fed7aa" stroke="#fdba74" stroke-width="1" />
    <!-- Graphite Lead -->
    <polygon points="6,-24 12,-24 9,-36" fill="#334155" />
  </g>

  <!-- Clear Acrylic Ruler Prop on Desk (Left Side) -->
  <g transform="translate(60, 120) rotate(-6)" filter="url(#pen-shadow)" opacity="0.9">
    <rect x="0" y="0" width="46" height="420" rx="4" fill="#ffffff" fill-opacity="0.75" stroke="#94a3b8" stroke-width="1" />
    <!-- Ruler Markings -->
    <g stroke="#334155" stroke-width="1">
      <line x1="0" y1="30" x2="22" y2="30" stroke-width="1.5" /><text x="26" y="34" font-size="9" font-family="sans-serif" fill="#334155" font-weight="700">0</text>
      <line x1="0" y1="50" x2="12" y2="50" />
      <line x1="0" y1="70" x2="16" y2="70" />
      <line x1="0" y1="90" x2="12" y2="90" />
      <line x1="0" y1="110" x2="22" y2="110" stroke-width="1.5" /><text x="26" y="114" font-size="9" font-family="sans-serif" fill="#334155" font-weight="700">5</text>
      <line x1="0" y1="130" x2="12" y2="130" />
      <line x1="0" y1="150" x2="16" y2="150" />
      <line x1="0" y1="170" x2="12" y2="170" />
      <line x1="0" y1="190" x2="22" y2="190" stroke-width="1.5" /><text x="26" y="194" font-size="9" font-family="sans-serif" fill="#334155" font-weight="700">10</text>
      <line x1="0" y1="210" x2="12" y2="210" />
      <line x1="0" y1="230" x2="16" y2="230" />
      <line x1="0" y1="250" x2="12" y2="250" />
      <line x1="0" y1="270" x2="22" y2="270" stroke-width="1.5" /><text x="26" y="274" font-size="9" font-family="sans-serif" fill="#334155" font-weight="700">15</text>
    </g>
  </g>
</svg>
