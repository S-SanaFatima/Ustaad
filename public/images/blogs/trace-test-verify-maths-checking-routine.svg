<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%" style="background:#ffffff; border-radius:18px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b36" />
      <stop offset="100%" stop-color="#0f4a9b" />
    </linearGradient>

    <!-- Card Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#C7A24A" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Card Drop Shadow -->
    <filter id="box-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="gold-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#C7A24A" />
    </marker>
  </defs>

  <!-- Container Canvas with Dark Navy Academic Background -->
  <rect width="1000" height="420" rx="18" fill="url(#bg-grad)" />

  <!-- Top Title & Badge -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="168" height="24" rx="12" fill="#C7A24A" fill-opacity="0.2" stroke="#C7A24A" stroke-width="1" />
    <text x="84" y="16" font-size="11" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="1">
      3-MINUTE ROUTINE
    </text>
    
    <text x="180" y="17" font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="0.5">
      USTAAD UAE · EXAM TIME MANAGEMENT STRATEGY
    </text>

    <text x="0" y="52" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      The 3-Minute Checking Routine: Trace · Test · Verify
    </text>
  </g>

  <!-- Connecting Connector Line Behind Cards -->
  <line x1="200" y1="230" x2="800" y2="230" stroke="#C7A24A" stroke-width="3" stroke-dasharray="6 6" opacity="0.6" />

  <!-- Three Connected Step Panels -->
  <!-- STEP 1: TRACE -->
  <g transform="translate(40, 115)" filter="url(#box-shadow)">
    <rect width="280" height="260" rx="16" fill="url(#card-grad)" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Gold Top Stripe -->
    <rect x="0" y="0" width="280" height="6" rx="3" fill="#C7A24A" />

    <!-- Step Badge -->
    <rect x="20" y="22" width="110" height="26" rx="13" fill="#0f4a9b" />
    <text x="75" y="39" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
      MINUTE 1
    </text>

    <text x="20" y="80" font-size="22" font-weight="800" fill="#0a1f3d">
      Trace the working
    </text>

    <text x="20" y="105" font-size="12.5" font-weight="700" fill="#C7A24A" letter-spacing="0.5">
      FOCUS: COPYING &amp; SIGNS
    </text>

    <line x1="20" y1="120" x2="260" y2="120" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Bullet items -->
    <g transform="translate(20, 142)">
      <circle cx="5" cy="5" r="3.5" fill="#0f4a9b" />
      <text x="16" y="9" font-size="12" font-weight="600" fill="#334155">Check values &amp; signs vs question</text>

      <circle cx="5" cy="32" r="3.5" fill="#0f4a9b" />
      <text x="16" y="36" font-size="12" font-weight="600" fill="#334155">Compare consecutive lines</text>

      <circle cx="5" cy="59" r="3.5" fill="#0f4a9b" />
      <text x="16" y="63" font-size="12" font-weight="600" fill="#334155">Check command word meaning</text>
    </g>

    <rect x="20" y="226" width="240" height="22" rx="4" fill="#eff6ff" />
    <text x="140" y="241" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">
      Find the first questionable line
    </text>
  </g>

  <!-- STEP 2: TEST -->
  <g transform="translate(360, 115)" filter="url(#box-shadow)">
    <rect width="280" height="260" rx="16" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="2" />
    <!-- Gold Top Stripe -->
    <rect x="0" y="0" width="280" height="6" rx="3" fill="#f59e0b" />

    <!-- Step Badge -->
    <rect x="20" y="22" width="110" height="26" rx="13" fill="#d97706" />
    <text x="75" y="39" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
      MINUTE 2
    </text>

    <text x="20" y="80" font-size="22" font-weight="800" fill="#0a1f3d">
      Test vulnerable step
    </text>

    <text x="20" y="105" font-size="12.5" font-weight="700" fill="#d97706" letter-spacing="0.5">
      FOCUS: RULES &amp; OPERATIONS
    </text>

    <line x1="20" y1="120" x2="260" y2="120" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Bullet items -->
    <g transform="translate(20, 142)">
      <circle cx="5" cy="5" r="3.5" fill="#d97706" />
      <text x="16" y="9" font-size="12" font-weight="600" fill="#334155">Recalculate suspicious operation</text>

      <circle cx="5" cy="32" r="3.5" fill="#d97706" />
      <text x="16" y="36" font-size="12" font-weight="600" fill="#334155">Check both sides of equation</text>

      <circle cx="5" cy="59" r="3.5" fill="#d97706" />
      <text x="16" y="63" font-size="12" font-weight="600" fill="#334155">Inspect fractions &amp; negatives</text>
    </g>

    <rect x="20" y="226" width="240" height="22" rx="4" fill="#fffbeb" />
    <text x="140" y="241" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">
      Isolate which rule broke down
    </text>
  </g>

  <!-- STEP 3: VERIFY -->
  <g transform="translate(680, 115)" filter="url(#box-shadow)">
    <rect width="280" height="260" rx="16" fill="url(#card-grad)" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Gold Top Stripe -->
    <rect x="0" y="0" width="280" height="6" rx="3" fill="#10b981" />

    <!-- Step Badge -->
    <rect x="20" y="22" width="110" height="26" rx="13" fill="#059669" />
    <text x="75" y="39" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
      MINUTE 3
    </text>

    <text x="20" y="80" font-size="22" font-weight="800" fill="#0a1f3d">
      Verify the answer
    </text>

    <text x="20" y="105" font-size="12.5" font-weight="700" fill="#059669" letter-spacing="0.5">
      FOCUS: INDEPENDENT CHECK
    </text>

    <line x1="20" y1="120" x2="260" y2="120" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Bullet items -->
    <g transform="translate(20, 142)">
      <circle cx="5" cy="5" r="3.5" fill="#059669" />
      <text x="16" y="9" font-size="12" font-weight="600" fill="#334155">Substitute answer into original</text>

      <circle cx="5" cy="32" r="3.5" fill="#059669" />
      <text x="16" y="36" font-size="12" font-weight="600" fill="#334155">Confirm units &amp; rounding</text>

      <circle cx="5" cy="59" r="3.5" fill="#059669" />
      <text x="16" y="63" font-size="12" font-weight="600" fill="#334155">Check question asks for this</text>
    </g>

    <rect x="20" y="226" width="240" height="22" rx="4" fill="#ecfdf5" />
    <text x="140" y="241" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">
      Both sides equal = answer confirmed
    </text>
  </g>
</svg>
