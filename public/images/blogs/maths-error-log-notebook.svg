<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" style="background:#f1f5f9; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Desk Wood / Slate Surface -->
    <linearGradient id="desk-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Notebook Paper Drop Shadow -->
    <filter id="nb-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0a1f3d" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0a1f3d" flood-opacity="0.06" />
    </filter>

    <filter id="pen-drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>

    <!-- Grid / Graph Paper Pattern for Error Log -->
    <pattern id="table-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Desk -->
  <rect width="1100" height="620" fill="url(#desk-surface)" />

  <!-- Open Notebook Body -->
  <g transform="translate(60, 40)" filter="url(#nb-shadow)">
    <!-- Book Cover Edge Shadow -->
    <rect x="-10" y="-8" width="980" height="546" rx="16" fill="#1e293b" opacity="0.15" />

    <!-- Open Book Pages (Left & Right Pages) -->
    <rect width="960" height="530" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="960" height="530" rx="12" fill="url(#table-grid)" opacity="0.7" />

    <!-- Center Binding Crease -->
    <line x1="480" y1="0" x2="480" y2="530" stroke="#cbd5e1" stroke-width="2" />
    <rect x="470" y="0" width="20" height="530" fill="#f8fafc" opacity="0.6" />

    <!-- Header Banner -->
    <g transform="translate(36, 25)">
      <rect x="0" y="0" width="888" height="34" rx="6" fill="#0f4a9b" />
      <text x="20" y="22" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1">
        STUDENT REVISION LOG · GCSE / IGCSE MATHEMATICS ERROR LOG
      </text>
      <text x="868" y="22" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="end">
        PATTERN TRACKING PROTOCOL
      </text>
    </g>

    <!-- Error Log Table -->
    <g transform="translate(36, 80)">
      <!-- Table Header Row -->
      <rect x="0" y="0" width="888" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      
      <!-- Columns: Question (170) | First Incorrect Step (190) | Why It Was Incorrect (270) | Check That Caught It (258) -->
      <line x1="170" y1="0" x2="170" y2="400" stroke="#e2e8f0" stroke-width="1.5" />
      <line x1="360" y1="0" x2="360" y2="400" stroke="#e2e8f0" stroke-width="1.5" />
      <line x1="630" y1="0" x2="630" y2="400" stroke="#e2e8f0" stroke-width="1.5" />

      <!-- Header Labels -->
      <text x="16" y="26" font-size="12" font-weight="800" fill="#0a1f3d" letter-spacing="0.5">QUESTION</text>
      <text x="186" y="26" font-size="12" font-weight="800" fill="#0a1f3d" letter-spacing="0.5">FIRST INCORRECT STEP</text>
      <text x="376" y="26" font-size="12" font-weight="800" fill="#0a1f3d" letter-spacing="0.5">WHY IT WAS INCORRECT</text>
      <text x="646" y="26" font-size="12" font-weight="800" fill="#0a1f3d" letter-spacing="0.5">CHECK THAT WOULD HAVE CAUGHT IT</text>

      <!-- Row 1: 4(x - 1) = 20 -->
      <g transform="translate(0, 42)">
        <rect x="0" y="0" width="888" height="110" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
        <line x1="0" y1="110" x2="888" y2="110" stroke="#e2e8f0" stroke-width="1" />

        <!-- Question Cell -->
        <text x="16" y="38" font-size="15" font-weight="700" fill="#0f4a9b" font-family="'Times New Roman', serif">4(x − 1) = 20</text>
        <text x="16" y="60" font-size="11" font-weight="600" fill="#64748b">Algebra / Brackets</text>

        <!-- Incorrect Step Cell -->
        <rect x="180" y="20" width="130" height="30" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
        <text x="190" y="40" font-size="14" font-weight="700" fill="#b91c1c" font-family="'Times New Roman', serif">4x − 1 = 20</text>

        <!-- Why Incorrect Cell -->
        <text x="376" y="36" font-size="13" font-weight="600" fill="#1e293b">4 multiplies both terms</text>
        <text x="376" y="56" font-size="13" font-weight="600" fill="#1e293b">inside the bracket</text>
        <text x="376" y="80" font-size="12" font-weight="700" fill="#059669">Should be: 4x − 4 = 20 → x = 6</text>

        <!-- Check Cell -->
        <text x="646" y="36" font-size="12.5" font-weight="600" fill="#334155">Substituting candidate 5.25 gives:</text>
        <text x="646" y="58" font-size="13" font-weight="700" fill="#dc2626">4(4.25) = 17 ≠ 20 ✗</text>
      </g>

      <!-- Row 2: 5 - 2x = 11 -->
      <g transform="translate(0, 152)">
        <rect x="0" y="0" width="888" height="110" fill="#fcfdfe" stroke="#f1f5f9" stroke-width="1" />
        <line x1="0" y1="110" x2="888" y2="110" stroke="#e2e8f0" stroke-width="1" />

        <!-- Question Cell -->
        <text x="16" y="38" font-size="15" font-weight="700" fill="#0f4a9b" font-family="'Times New Roman', serif">5 − 2x = 11</text>
        <text x="16" y="60" font-size="11" font-weight="600" fill="#64748b">Negative signs slip</text>

        <!-- Incorrect Step Cell -->
        <rect x="180" y="20" width="100" height="30" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
        <text x="190" y="40" font-size="14" font-weight="700" fill="#b91c1c" font-family="'Times New Roman', serif">x = 3</text>

        <!-- Why Incorrect Cell -->
        <text x="376" y="36" font-size="13" font-weight="600" fill="#1e293b">Dividing by negative (−2)</text>
        <text x="376" y="56" font-size="13" font-weight="600" fill="#1e293b">yields negative result</text>
        <text x="376" y="80" font-size="12" font-weight="700" fill="#059669">Should be: 6 ÷ (−2) = −3</text>

        <!-- Check Cell -->
        <text x="646" y="36" font-size="12.5" font-weight="600" fill="#334155">Substitute candidate x = 3:</text>
        <text x="646" y="58" font-size="13" font-weight="700" fill="#dc2626">5 − 2(3) = −1 ≠ 11 ✗</text>
      </g>

      <!-- Row 3: 1/2 + 1/3 = 2/5 -->
      <g transform="translate(0, 262)">
        <rect x="0" y="0" width="888" height="110" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
        <line x1="0" y1="110" x2="888" y2="110" stroke="#e2e8f0" stroke-width="1" />

        <!-- Question Cell -->
        <text x="16" y="38" font-size="15" font-weight="700" fill="#0f4a9b" font-family="'Times New Roman', serif">1/2 + 1/3 = 2/5</text>
        <text x="16" y="60" font-size="11" font-weight="600" fill="#64748b">Fraction arithmetic</text>

        <!-- Incorrect Step Cell -->
        <rect x="180" y="20" width="168" height="44" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
        <text x="188" y="38" font-size="12" font-weight="700" fill="#b91c1c">Added numerators</text>
        <text x="188" y="54" font-size="12" font-weight="700" fill="#b91c1c">&amp; denominators</text>

        <!-- Why Incorrect Cell -->
        <text x="376" y="36" font-size="13" font-weight="600" fill="#1e293b">Fractions need a common</text>
        <text x="376" y="56" font-size="13" font-weight="600" fill="#1e293b">denominator first</text>
        <text x="376" y="80" font-size="12" font-weight="700" fill="#059669">Correct: 3/6 + 2/6 = 5/6</text>

        <!-- Check Cell -->
        <text x="646" y="36" font-size="12.5" font-weight="600" fill="#334155">Estimation check:</text>
        <text x="646" y="56" font-size="12.5" font-weight="600" fill="#334155">Sum must be &gt; 1/2 (0.5),</text>
        <text x="646" y="76" font-size="13" font-weight="700" fill="#dc2626">but 2/5 = 0.4 is less! ✗</text>
      </g>
    </g>
  </g>

  <!-- Luxury Red Teacher's Marking Pen resting across the notebook on right -->
  <g transform="translate(930, 260) rotate(-28)" filter="url(#pen-drop)">
    <!-- Pen barrel (Bright Red Gloss) -->
    <rect x="-8" y="-120" width="16" height="260" rx="4" fill="#dc2626" stroke="#991b1b" stroke-width="1" />
    <rect x="-4" y="-120" width="8" height="260" fill="#ef4444" opacity="0.6" />

    <!-- Silver Clip & Ring -->
    <rect x="-8" y="-90" width="16" height="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.75" />
    <path d="M 8 -90 L 16 -88 L 16 10 L 10 12 L 8 10 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8" />

    <!-- Grip section -->
    <rect x="-7" y="140" width="14" height="40" fill="#1e293b" />
    <!-- Silver Nib cone -->
    <polygon points="-7,180 7,180 0,215" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.75" />
    <!-- Ballpoint tip -->
    <circle cx="0" cy="215" r="1.5" fill="#dc2626" />
  </g>
</svg>
