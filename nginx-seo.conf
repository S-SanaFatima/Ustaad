# Paste into the cPanel / nginx site config for ustaad.ae
# Required so Soft 404s stop: do NOT fall back unknown paths to /index.html.

server {
    # ... existing listen / server_name / ssl / root ...

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Trailing slash removal (except root, handles query parameters)
    rewrite ^/(.+)/$ /$1 permanent;

    # Sitemap header - ensure search engines treat as sitemap and not HTML page
    location = /sitemap.xml {
        add_header Content-Type "application/xml; charset=utf-8";
        add_header X-Robots-Tag "noindex, follow";
    }

    # Arabic URLs → English equivalents
    location = /ar/gcse-tutor-dubai { return 301 /gcse-tutor-dubai; }
    location = /ar/gcse-tutor-dubai/ { return 301 /gcse-tutor-dubai; }
    location = /ar { return 301 /; }
    location = /ar/ { return 301 /; }
    location ~ ^/ar/(.*)$ { return 301 /$1; }

    # Duplicate / legacy slugs → canonical
    location = /apply-now { return 301 /contact; }
    location = /apply-now/ { return 301 /contact; }
    location = /american { return 301 /american-curriculum; }
    location = /american/ { return 301 /american-curriculum; }
    location = /british { return 301 /british-curriculum; }
    location = /british/ { return 301 /british-curriculum; }
    location = /ib-ap-as { return 301 /curriculum; }
    location = /ib-ap-as/ { return 301 /curriculum; }
    location = /ib { return 301 /ib-curriculum; }
    location = /ib/ { return 301 /ib-curriculum; }
    location = /sat-emsat { return 301 /exam-preparation; }
    location = /sat-emsat/ { return 301 /exam-preparation; }
    location = /gcse-cbse { return 301 /gcse; }
    location = /gcse-cbse/ { return 301 /gcse; }
    location = /mathematics { return 301 /maths; }
    location = /mathematics/ { return 301 /maths; }
    location = /mathtestlanding { return 301 /maths-tutor-abu-dhabi; }
    location = /mathtestlanding/ { return 301 /maths-tutor-abu-dhabi; }
    location = /uae-guide { return 301 /blogs; }
    location = /uae-guide/ { return 301 /blogs; }
    location = /subjects-tutoring { return 301 /subjects; }
    location = /subjects-tutoring/ { return 301 /subjects; }
    location = /tutors-private-tutor { return 301 /tutors; }
    location = /tutors-private-tutor/ { return 301 /tutors; }
    location = /faqs { return 301 /#faqs; }
    location = /faqs/ { return 301 /#faqs; }

    # Legacy blog post redirect
    location ~ ^/[0-9]{4}/[0-9]{2}/[0-9]{2}/lazy-students-effective-strategies {
        return 301 /blogs/psychology-of-learning;
    }

    # WordPress-era URLs → 410 Gone
    location ~ ^/author(/|$) { return 410; }
    location ~ ^/category(/|$) { return 410; }
    location ~ ^/elementor-hf(/|$) { return 410; }
    location ~ "^/[0-9]{4}/[0-9]{2}(/|$)" { return 410; }

    # Static prerendered site — real 404 for unknown URLs
    # Note: /authors/* are real pages (not WordPress /author/*)
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
